
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KB STRIDE - Login / Sign Up</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
            background: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 5px 25px rgba(0,0,0,.12);
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 4px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .tabs {
            display: flex;
            margin-bottom: 25px;
            border-bottom: 1px solid #ddd;
        }

        .tab {
            width: 50%;
            padding: 13px;
            border: none;
            background: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            color: #777;
        }

        .tab.active {
            color: black;
            border-bottom: 3px solid black;
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }

        h2 {
            text-align: center;
            margin-bottom: 22px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #111;
        }

        .main-button {
            width: 100%;
            padding: 14px;
            background: #111;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .main-button:hover {
            background: #333;
        }

        .secondary-button {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #111;
            background: white;
            color: #111;
            border-radius: 7px;
            font-weight: bold;
            cursor: pointer;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 22px 0;
            color: #888;
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #ddd;
        }

        .message {
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 6px;
            text-align: center;
            font-size: 14px;
        }

        .error {
            background: #ffe5e5;
            color: #c00000;
        }

        .success {
            background: #e5ffe9;
            color: #08752b;
        }

        .back-home {
            text-align: center;
            margin-top: 22px;
        }

        .back-home a {
            color: #111;
            text-decoration: none;
            font-size: 14px;
        }

        .back-home a:hover {
            text-decoration: underline;
        }

        .hint {
            font-size: 12px;
            color: #777;
            margin: -8px 0 15px;
        }

        @media(max-width: 480px) {
            .auth-container {
                padding: 25px 20px;
            }

            .logo {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

<div class="auth-container">

    <div class="logo">KB STRIDE</div>

    <div class="subtitle">OWN EVERY STEP.</div>

    <div class="tabs">

        <button type="button"
                class="tab active"
                id="loginTab"
                onclick="showSection('login')">
            LOGIN
        </button>

        <button type="button"
                class="tab"
                id="signupTab"
                onclick="showSection('signup')">
            SIGN UP
        </button>

    </div>

    <div class="message error"
         th:if="${error}"
         th:text="${error}">
    </div>

    <div class="message success"
         th:if="${param.signupSuccess}">
        Account created successfully. Please login.
    </div>

    <!-- LOGIN SECTION -->

    <section id="loginSection" class="form-section active">

        <h2>Welcome Back</h2>

        <div class="tabs">
            <button type="button"
                    class="tab active"
                    id="emailLoginTab"
                    onclick="showLoginMethod('email')">
                EMAIL
            </button>

            <button type="button"
                    class="tab"
                    id="mobileLoginTab"
                    onclick="showLoginMethod('mobile')">
                MOBILE OTP
            </button>
        </div>

        <!-- EMAIL LOGIN -->

        <form id="emailLogin"
              th:action="@{/login}"
              method="post">

            <input type="email"
                   name="email"
                   placeholder="Email Address"
                   autocomplete="email"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Password"
                   autocomplete="current-password"
                   required>

            <button type="submit" class="main-button">
                LOGIN
            </button>

        </form>

        <!-- MOBILE OTP LOGIN -->

        <div id="mobileLogin" style="display:none;">

            <form th:action="@{/send-otp}" method="post">

                <input type="tel"
                       name="mobileNumber"
                       placeholder="10-digit mobile number"
                       pattern="[6-9][0-9]{9}"
                       maxlength="10"
                       required>

                <button type="submit" class="main-button">
                    SEND OTP
                </button>

            </form>

            <div class="divider">VERIFY OTP</div>

            <form th:action="@{/verify-otp}" method="post">

                <input type="tel"
                       name="mobileNumber"
                       placeholder="Mobile number"
                       pattern="[6-9][0-9]{9}"
                       maxlength="10"
                       required>

                <input type="text"
                       name="otp"
                       placeholder="Enter 6-digit OTP"
                       pattern="[0-9]{6}"
                       maxlength="6"
                       inputmode="numeric"
                       required>

                <button type="submit" class="main-button">
                    VERIFY & LOGIN
                </button>

            </form>

        </div>

    </section>


    <!-- SIGNUP SECTION -->

    <section id="signupSection" class="form-section">

        <h2>Create Your Account</h2>

        <form th:action="@{/signup}" method="post">

            <input type="text"
                   name="fullName"
                   placeholder="Full Name"
                   autocomplete="name"
                   maxlength="100"
                   required>

            <input type="email"
                   name="email"
                   placeholder="Email Address"
                   autocomplete="email"
                   required>

            <input type="tel"
                   name="mobileNumber"
                   placeholder="10-digit Mobile Number"
                   pattern="[6-9][0-9]{9}"
                   maxlength="10"
                   autocomplete="tel"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Create Password"
                   minlength="8"
                   autocomplete="new-password"
                   required>

            <p class="hint">
                Mobile verification will be required during registration.
            </p>

            <button type="submit" class="main-button">
                CREATE ACCOUNT
            </button>

        </form>

    </section>


    <div class="back-home">
        <a th:href="@{/}">← Back to Home</a>
    </div>

</div>


<script>

    function showSection(section) {

        document.getElementById("loginSection")
            .classList.toggle("active", section === "login");

        document.getElementById("signupSection")
            .classList.toggle("active", section === "signup");

        document.getElementById("loginTab")
            .classList.toggle("active", section === "login");

        document.getElementById("signupTab")
            .classList.toggle("active", section === "signup");
    }

    function showLoginMethod(method) {

        document.getElementById("emailLogin").style.display =
            method === "email" ? "block" : "none";

        document.getElementById("mobileLogin").style.display =
            method === "mobile" ? "block" : "none";

        document.getElementById("emailLoginTab")
            .classList.toggle("active", method === "email");

        document.getElementById("mobileLoginTab")
            .classList.toggle("active", method === "mobile");
    }

    // Keep signup selected if the backend returns a signup error.
    const signupError = new URLSearchParams(window.location.search)
        .get("mode");

    if (signupError === "signup") {
        showSection("signup");
    }

</script>

</body>
</html>
