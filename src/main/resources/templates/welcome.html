
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KB STRIDE - Own Every Step</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;

            background:
                linear-gradient(
                    rgba(0,0,0,.48),
                    rgba(0,0,0,.48)
                ),
                url('/images/background6.jpg');

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            color: white;
        }

        header {
            width: 100%;
            padding: 30px 50px;

            display: flex;
            justify-content: flex-end;
            align-items: center;

            position: absolute;
            top: 0;
            left: 0;
        }

        .auth-buttons {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .auth-buttons a {
            text-decoration: none;
            color: white;
            padding: 12px 25px;
            border: 1px solid white;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            transition: .3s;
        }

        .auth-buttons a:hover {
            background: white;
            color: black;
        }

        .brand-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .brand-name {
            font-size: 80px;
            font-weight: 900;
            letter-spacing: 10px;
            text-shadow: 2px 2px 10px black;
        }

        .tagline {
            margin-top: 15px;
            font-size: 22px;
            letter-spacing: 8px;
            font-weight: 500;
            text-shadow: 2px 2px 8px black;
        }

        .shop-link {
            margin-top: 35px;
            text-decoration: none;
            color: white;
            border: 1px solid white;
            padding: 14px 35px;
            border-radius: 30px;
            font-weight: bold;
            transition: .3s;
        }

        .shop-link:hover {
            background: white;
            color: black;
        }

        @media(max-width: 768px) {

            header {
                padding: 20px 12px;
                justify-content: center;
            }

            .auth-buttons {
                gap: 8px;
            }

            .auth-buttons a {
                padding: 10px 13px;
                font-size: 11px;
            }

            .brand-name {
                font-size: 43px;
                letter-spacing: 5px;
            }

            .tagline {
                font-size: 13px;
                letter-spacing: 4px;
            }
        }

        @media(max-width: 360px) {

            .auth-buttons a {
                padding: 9px 10px;
                font-size: 10px;
            }

            .brand-name {
                font-size: 35px;
            }
        }

    </style>

</head>

<body>

<header>

    <nav class="auth-buttons">

        <a th:href="@{/auth}">
            LOGIN / SIGN UP
        </a>

        <a th:href="@{/track-order}">
            TRACK ORDER
        </a>

    </nav>

</header>


<main class="brand-container">

    <div class="brand-name">
        KB STRIDE
    </div>

    <div class="tagline">
        OWN EVERY STEP.
    </div>

    <a th:href="@{/auth}" class="shop-link">
        EXPLORE COLLECTION
    </a>

</main>

</body>

</html>
