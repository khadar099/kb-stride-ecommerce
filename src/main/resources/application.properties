
# ==========================================
# APPLICATION
# ==========================================

spring.application.name=welcome-page
server.port=8181


# ==========================================
# H2 DATABASE
# ==========================================

spring.datasource.url=jdbc:h2:file:/app/data/kbstride
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=


# ==========================================
# JPA / HIBERNATE
# ==========================================

# Update database schema without intentionally
# deleting existing customer records
spring.jpa.hibernate.ddl-auto=update

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Disable SQL logging in production
spring.jpa.show-sql=false

spring.jpa.open-in-view=false


# ==========================================
# H2 CONSOLE
# ==========================================

# Development only
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console


# ==========================================
# THYMELEAF
# ==========================================

spring.thymeleaf.cache=true


# ==========================================
# SPRING SECURITY
# ==========================================

# Session timeout
server.servlet.session.timeout=30m

# Session cookie settings
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax


# ==========================================
# OTP CONFIGURATION
# ==========================================

# OTP validity: 5 minutes
app.otp.expiry-seconds=300

# Resend OTP after 60 seconds
app.otp.resend-cooldown-seconds=60

# Maximum verification attempts
app.otp.max-attempts=5


# ==========================================
# MSG91 SMS CONFIGURATION
# ==========================================

app.sms.provider=msg91

# Credentials are supplied through environment variables
app.sms.msg91.auth-key=${MSG91_AUTH_KEY:}

app.sms.msg91.template-id=${MSG91_TEMPLATE_ID:}


# ==========================================
# APPLICATION LOGGING
# ==========================================

logging.level.root=INFO

logging.level.com.khadar.welcomepage=INFO

logging.level.org.springframework.web=INFO

logging.level.org.springframework.security=INFO

logging.level.org.hibernate=INFO


# ==========================================
# LOG FILE
# ==========================================

logging.file.name=/app/logs/kbstride.log


# ==========================================
# LOG ROTATION
# ==========================================

logging.logback.rollingpolicy.max-file-size=10MB

logging.logback.rollingpolicy.max-history=30

logging.logback.rollingpolicy.total-size-cap=1GB

logging.logback.rollingpolicy.file-name-pattern=/app/logs/kbstride.%d{yyyy-MM-dd}.%i.log.gz
