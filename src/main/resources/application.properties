spring.application.name=welcome-page
server.port=8181

# ==========================================
# H2 Database
# ==========================================

spring.datasource.url=jdbc:h2:file:/app/data/kbstride
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ==========================================
# JPA / Hibernate
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true

# ==========================================
# H2 Console
# ==========================================

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==========================================
# Thymeleaf
# ==========================================

spring.thymeleaf.cache=false

# ==========================================
# APPLICATION LOGGING
# ==========================================

# Default application log level
logging.level.root=INFO

# KB STRIDE application logs
logging.level.com.khadar.welcomepage=INFO

# Spring Web logs
logging.level.org.springframework.web=INFO

# Hibernate logs
logging.level.org.hibernate=INFO

# ==========================================
# LOG FILE
# ==========================================

# Log file location
logging.file.name=/app/logs/kbstride.log

# ==========================================
# LOG FILE ROTATION
# ==========================================

# Maximum size of one log file
logging.logback.rollingpolicy.max-file-size=10MB

# Keep 30 days of old log files
logging.logback.rollingpolicy.max-history=30

# Total size of all archived logs
logging.logback.rollingpolicy.total-size-cap=1GB

# Compress old log files
logging.logback.rollingpolicy.file-name-pattern=/app/logs/kbstride.%d{yyyy-MM-dd}.%i.log.gz
